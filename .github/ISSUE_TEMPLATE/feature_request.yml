name: Feature request
description: Suggest something the platform should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: dropdown
    id: who
    attributes:
      label: Who is this for
      options:
        - Prospective residents browsing rooms
        - Current residents
        - Admin / property staff
        - Developers working on the codebase
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
